<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Vary.video creates batches of personalized video ad variants from one template."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Vary.video</title>
  </head>
  <body>
    <div id="root"></div>
    <div id="debug-error-overlay" style="display:none;position:fixed;top:0;left:0;right:0;z-index:99999;background:#fee;color:#900;padding:16px;font-family:monospace;font-size:12px;white-space:pre-wrap;max-height:60vh;overflow:auto;border-bottom:3px solid red;"></div>
    <script>
      // Global error capture — displays errors on screen for debugging
      (function() {
        var overlay = document.getElementById('debug-error-overlay');
        var errors = [];
        function showError(msg) {
          errors.push(msg);
          overlay.style.display = 'block';
          overlay.textContent = errors.join('\n\n');
        }
        window.addEventListener('error', function(e) {
          showError('ERROR: ' + e.message + '\n  at ' + (e.filename || '?') + ':' + e.lineno + ':' + e.colno);
        });
        window.addEventListener('unhandledrejection', function(e) {
          var reason = e.reason;
          var msg = reason instanceof Error ? reason.message + '\n' + reason.stack : String(reason);
          showError('PROMISE REJECTION: ' + msg);
        });
      })();
    </script>
    <script>
      // Runtime API base override for tunnel demos:
      //   https://vary-video.pages.dev/?api=https://<tunnel-host>/api
      // Persists in localStorage for the session so refreshes keep working.
      (function () {
        try {
          var params = new URLSearchParams(window.location.search);
          var api = params.get('api');
          if (api) {
            window.__VARY_API_URL = api;
            localStorage.setItem('vary_api_url', api);
            // Strip the ?api= param so it doesn't linger in the address bar.
            var url = new URL(window.location.href);
            url.searchParams.delete('api');
            window.history.replaceState({}, '', url.toString());
          } else {
            var saved = localStorage.getItem('vary_api_url');
            if (saved) {
              window.__VARY_API_URL = saved;
            }
          }
        } catch (e) {
          // Never block app boot on override parsing.
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
